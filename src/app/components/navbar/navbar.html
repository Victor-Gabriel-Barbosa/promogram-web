<nav
  class="sticky top-0 z-50 w-full flex items-center justify-between p-2 bg-(--mat-sys-surface) border-b border-(--mat-sys-primary)">
  <a class="flex items-center gap-1 min-w-0" routerLink="/">
    <img [src]="logo" alt="Logo" class="h-10 w-10 mr-2 shrink-0" />
    <h1 class="text-(--mat-sys-primary) font-bold text-xl truncate">
      {{ title }}
    </h1>
  </a>

  <div class="hidden sm:flex items-center gap-2">
    @for (item of items; track item.label) {
    <app-navbar-item [item]="item"></app-navbar-item>
    }
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="sm:hidden flex items-center gap-2">
    <app-theme-toggle></app-theme-toggle>
    <button mat-icon-button (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Abrir menu"
      matTooltip="{{ menuOpen ? 'Fechar menu' : 'Abrir menu' }}">
      <mat-icon>
        {{ menuOpen ? 'close' : 'menu' }}
      </mat-icon>
    </button>
  </div>
</nav>



@if (menuOpen) {
<div class="sticky top-14 z-40 sm:hidden bg-(--mat-sys-surface) border-b border-(--mat-sys-primary) p-2">
  <div class="flex flex-col items-center justify-center gap-1">
    @for (item of items; track item.label) {
    <app-navbar-item [item]="item"></app-navbar-item>
    }
  </div>
</div>
}
